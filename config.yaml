# =====================================================================
#  AmazonBot settings — edit any number here, commit, and the next run
#  uses it. Money is in US dollars. Percentages are written as 0.35 = 35%.
# =====================================================================

marketplace: US                     # Amazon.com only for now

# ---------------------------------------------------------------------
# 1. What counts as a good lead
# ---------------------------------------------------------------------
thresholds:
  min_profit: 5.00                  # your SellerAmp setting
  min_roi: 0.35                     # 35%
  min_sell_price: 10.00             # skip items selling under $10 (fees eat them)

starter_mode:
  enabled: true                     # turn off after ~3 months / once sales roll in
  min_profit: 3.00
  min_roi: 0.30
  min_est_monthly_sales: 100        # starter rules only apply to fast sellers

# Max sales rank (BSR) per main category. Lower rank = sells more.
# Roughly "top 1-2%" of each category. Anything not listed uses `default`.
max_rank:
  default: 150000
  Grocery: 90000
  Grocery & Gourmet Food: 90000
  Health & Household: 150000
  Beauty & Personal Care: 150000
  Beauty: 150000
  Toys & Games: 120000
  Home & Kitchen: 250000
  Kitchen: 250000
  Pet Supplies: 90000
  Baby: 60000
  Office Products: 120000
  Arts, Crafts & Sewing: 90000
  Sports & Outdoors: 180000
  Tools & Home Improvement: 180000
  Patio, Lawn & Garden: 90000

# ---------------------------------------------------------------------
# 2. Your costs (matches your SellerAmp setup + extras for accuracy)
# ---------------------------------------------------------------------
costs:
  sales_tax_rate: 0.105             # Chicago general merchandise (Sep 2026)
  grocery_tax_rate: 0.0225          # local-only grocery tax estimate; check your receipts
  grocery_categories: ["Grocery", "Grocery & Gourmet Food"]
  inbound_per_lb: 1.60              # shipping to Amazon, per pound
  dim_weight_divisor: 139           # inbound billed on max(actual, L*W*H/139)
  placement_fee: 0.00               # Amazon Optimized Splits
  prep_per_unit: 0.40
  misc_per_unit: 0.75               # labels, polybags, boxes, tape
  storage_months: 2
  # FBA monthly storage, standard-size, $ per cubic foot. Verify against
  # Amazon's current fee page once a year; Oct-Dec is peak season.
  storage_rate_jan_sep: 0.78
  storage_rate_oct_dec: 2.40
  returns_reserve:                  # % of sale price set aside for returns
    default: 0.02
    Clothing, Shoes & Jewelry: 0.08
    Grocery & Gourmet Food: 0.01
    Grocery: 0.01
  price_drop_test: 0.10             # also show profit if price falls 10%

# ---------------------------------------------------------------------
# 3. Discounts (details per retailer live in retailers.yaml)
# ---------------------------------------------------------------------
savings:
  count_cashback_toward_pass: false # cashback = bonus only (arrives later, may not track)

# Competition / listing quality
competition:
  min_sales_per_seller: 2           # flag if est. sales / (FBA sellers + you) is below this
  skip_seller_bundles: true         # hide reseller-made bundles ("+ guide", "includes ...")

# ---------------------------------------------------------------------
# 4. Buying
# ---------------------------------------------------------------------
buying:
  max_units_first_buy: 15           # beginner cap on suggested quantity
  max_spend_per_product: 150.00     # set to your budget; caps suggested qty

# ---------------------------------------------------------------------
# 5. How much the bot searches each run
# ---------------------------------------------------------------------
search:
  max_brands_per_run: 60            # brands scanned per day (oldest-checked first)
  max_pages_per_brand: 10           # 20 products per page
  discovery_keywords_per_run: 10    # keyword searches used to find NEW brands
  eligibility_cache_days: 7         # re-check eligibility weekly
  max_run_minutes: 50               # GitHub free plan = 2,000 min/month for private repos
  skip_variation_parents: true

# Words searched to discover new brands you may be eligible for.
discovery_keywords:
  - protein bar
  - granola
  - coffee pods
  - herbal tea
  - vitamin c
  - multivitamin gummies
  - dog treats
  - cat litter
  - shampoo
  - body wash
  - lip balm
  - dish soap
  - laundry pods
  - paper towels
  - storage bins
  - acrylic paint
  - sticky notes
  - baby wipes
  - snack variety pack
  - hot sauce
  - seasoning blend
  - trash bags
  - hand soap
  - electrolyte powder

# ---------------------------------------------------------------------
# 6. Supplier discovery — all on free allowances ($0/month)
# ---------------------------------------------------------------------
# Order per product (cheapest first):
#   1. your price lists + Best Buy API (free, exact UPC)
#   2. Google Shopping by UPC: Serper first, SerpApi if Serper is out
#   3. Google Shopping by brand+title if the UPC finds nothing
#   4. Tavily page search (last resort; prices from page text are never trusted alone)
#   5. VERIFY with SerpApi only when an offer already looks profitable:
#      Walmart UPC lookup and Google's all-store comparison (stock + direct links)
providers:
  serper:
    starting_credits: 2500          # one-time free credits; raise this if you ever top up
    max_per_run: 80                 # ~80/day lasts about a month
  serpapi:
    max_per_run: 40                 # real cap = searches left / days left in month
    reserve: 5
  tavily:
    monthly_credits: 1000
    max_per_run: 30
  bestbuy:
    daily_calls: 50000
    max_per_run: 2000               # 1 call checks up to 100 UPCs

suppliers:
  cache_days: 2                     # reuse a store price for up to 2 days (free)
  max_price_age_days: 2             # older prices can't make a Lead
  recheck_after_days:               # don't re-search recent dead ends (saves searches)
    no_offers: 14
    no_match: 10
    too_expensive: 5
  serpapi_discovery_share: 0.4      # SerpApi keeps 60% of its run budget for verification
  title_search_fallback: true       # if the UPC finds nothing, search brand + title
  min_candidate_max_buy: 3.00       # don't spend searches if max buy price < $3
  allow_unknown_retailers: false    # stores not in retailers.yaml -> Needs Review, not Leads
  allow_marketplace_sellers: false  # Walmart 3rd-party sellers -> Needs Review
  max_options_per_product: 8        # rows per product in the Supplier Options tab
  blocked_sources:                  # never treated as suppliers
    - amazon
    - ebay
    - mercari
    - poshmark
    - etsy
    - aliexpress
    - temu
    - shein
    - facebook
    - offerup
    - whatnot
    - dhgate
    - wish
    - alibaba

# ---------------------------------------------------------------------
# 6b. Compliance and what may become a Lead
# ---------------------------------------------------------------------
compliance:
  # Products whose title suggests these are dropped completely.
  # Other checks (supplement, medical, meltable, age_restricted, expiration)
  # are shown as flags so you can decide.
  block: [hazmat, pesticide, cbd]

leads:
  # A product with any of these flags never goes to the Leads tab.
  exclude_flags: [amazon_now, amazon_recent, ip_drop, bundle, crowded, no_buybox, infant]
  # A Lead needs ALL of these verified (otherwise it goes to Needs Review with the reason):
  require_upc_verified: true        # UPC confirmed (Walmart/Best Buy/price list) or found by
                                    # searching the exact UPC with brand + size + pack agreeing
  require_in_stock: true            # store shows "In stock"
  require_direct_link: true         # a real store product link, not a Google redirect

# ---------------------------------------------------------------------
# 7. Alerts (Discord)
# ---------------------------------------------------------------------
alerts:
  min_profit: 7.00                  # only ping for strong leads
  min_roi: 0.50
  realert_after_days: 14            # repeat only if this long has passed...
  realert_profit_change: 0.20       # ...or profit changed 20%+, or eligibility changed
